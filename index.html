<html lang="vi">

<style>
:root{--c:#7048e8;--a:#ffb020;--bg:color-mix(in srgb,var(--c) 6%,#f9f8fb);--ink:color-mix(in srgb,var(--c) 8%,#12101a);--mu:color-mix(in srgb,var(--c) 10%,#65606f);--ln:color-mix(in srgb,var(--c) 12%,#e4e1ea);--w:#fff;--rd:#d9382c;--sh:0 8px 28px rgba(40,20,90,.13);--g:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 72%,#0b1233));--fs:15px;--tap:40px;--btn:48px;--gw:150px;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:var(--c)}

@media(prefers-color-scheme:dark){:root:not([data-th="1"]){--bg:color-mix(in srgb,var(--c) 8%,#0f0e13);--ink:color-mix(in srgb,var(--c) 6%,#efedf4);--mu:color-mix(in srgb,var(--c) 12%,#a29db0);--ln:color-mix(in srgb,var(--c) 16%,#28262f);--w:color-mix(in srgb,var(--c) 8%,#17161c);--sh:0 8px 28px rgba(0,0,0,.4)}:root:not([data-th="1"]) .t-ok{color:#4cc27a!important}:root:not([data-th="1"]) .t-wr{color:#f0b429!important}:root:not([data-th="1"]) .t-bd{color:#ff7b72!important}}
:root[data-th="2"]{--bg:color-mix(in srgb,var(--c) 8%,#0f0e13);--ink:color-mix(in srgb,var(--c) 6%,#efedf4);--mu:color-mix(in srgb,var(--c) 12%,#a29db0);--ln:color-mix(in srgb,var(--c) 16%,#28262f);--w:color-mix(in srgb,var(--c) 8%,#17161c);--sh:0 8px 28px rgba(0,0,0,.4)}:root[data-th="2"] .t-ok{color:#4cc27a!important}:root[data-th="2"] .t-wr{color:#f0b429!important}:root[data-th="2"] .t-bd{color:#ff7b72!important}
#upd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:7px 7px 7px 16px;border-radius:99px;z-index:30;box-shadow:var(--sh);white-space:nowrap}#upd button{background:var(--c);color:#fff;border:0;border-radius:99px;padding:9px 15px;font-weight:700;min-height:0;cursor:pointer}@media(max-width:820px){#upd{bottom:calc(86px + env(safe-area-inset-bottom))}}

*{box-sizing:border-box;margin:0}html,body{height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}body{-webkit-tap-highlight-color:transparent;font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template:"h h" auto "n m" minmax(0,1fr)/84px 1fr;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s,filter .2s}button:active{transform:scale(.95)}button:disabled{opacity:.5}button,.it{touch-action:manipulation;-webkit-user-select:none;user-select:none}button:focus-visible{outline:2px solid var(--c);outline-offset:2px}

.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.8em;font-weight:600;padding:10px 2px;border-radius:14px;color:var(--mu)}.tab b{font-size:1.45em;transition:transform .25s}.tab.on{background:var(--g);color:#fff;box-shadow:var(--sh)}.tab.on b{transform:scale(1.15)}
.bdg{position:absolute;top:4px;left:calc(50% + 8px);background:var(--rd);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:.8em;display:grid;place-items:center;padding:0 5px}
main{grid-area:m;min-height:0;position:relative}.v{display:none;height:100%;overflow:auto;padding:16px;overscroll-behavior:contain}.v.on{display:block}
#v-tg.on{display:grid;grid-template-columns:1fr 380px;gap:0;overflow:hidden;padding:0}

.it{background:var(--w);border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:84px;overflow-wrap:anywhere}
.it span{color:var(--mu);font-size:.87em}.it .p{color:var(--c);font-weight:700;font-size:.93em}.it.in{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 30%,transparent)}.it i{position:absolute;top:8px;right:10px;font-style:normal;color:var(--a)}
.it .p.t-ok{color:#1a7f37}.it .p.t-wr{color:#b26a00}.it .p.t-bd{color:var(--rd)}
@media(hover:hover){.it:hover{transform:translateY(-3px);box-shadow:var(--sh)}}

.mu{color:var(--mu)}.t-ok{color:#1a7f37}.t-wr{color:#b26a00}.t-bd{color:var(--rd)}
.big{font-size:2em;font-weight:800;color:var(--c);line-height:1.2}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.row button{white-space:nowrap;padding-left:8px;padding-right:8px}
.pri,.ghost,.dng{padding:11px 14px;min-height:var(--btn);border-radius:12px;border:1px solid var(--c);font-weight:700}.pri{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}.ghost{color:var(--c)}.dng{color:var(--rd);border-color:var(--rd)}
.card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}.card h3{margin-bottom:8px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sub{background:var(--bg);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:.87em;color:var(--mu);margin-bottom:8px}label input,label select{color:var(--ink);margin-top:3px}
.req{color:var(--rd)}.hint{display:block;font-size:.8em;color:var(--mu);margin-top:3px;font-weight:400}.er{color:var(--rd);font-size:.87em;margin-top:6px}.er:empty{display:none}
.ck{display:flex;align-items:center;gap:8px;font-size:1em;color:var(--ink);padding:6px 0}.ck input{width:22px;height:22px;margin:0;flex:none}
details.adv{margin:8px 0}details.adv summary{cursor:pointer;color:var(--c);font-weight:700;padding:8px 0}
.li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}.li>span:first-child{min-width:0;overflow-wrap:anywhere}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.st div{background:var(--bg);border-radius:12px;padding:10px;color:var(--mu);font-size:.87em}.st b{display:block;font-size:1.27em;color:var(--ink)}.st small{display:block;font-size:.8em}
input[type=color]{display:block;height:var(--btn);width:88px;padding:4px 6px;cursor:pointer}
details.sec>summary{list-style:none;cursor:pointer;font-weight:700;font-size:1.17em;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--tap)}details.sec>summary::-webkit-details-marker{display:none}details.sec>summary::after{content:'▾';color:var(--mu);transition:transform .2s;flex:none}details.sec:not([open])>summary::after{transform:rotate(-90deg)}details.sec[open]>summary{margin-bottom:6px}details.sec+details.sec{margin-top:12px;padding-top:6px;border-top:1px solid var(--ln)}
.sv{position:sticky;bottom:0;background:var(--w);padding:8px 0 2px;margin-top:8px;border-top:1px solid var(--ln);z-index:1}.sw{width:32px;height:32px;border-radius:50%;margin:8px 8px 0 0;padding:0;border:2px solid var(--ln)}.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;white-space:nowrap;min-height:var(--tap);border:1px solid var(--ln);border-radius:10px;font-weight:600}.seg .on{background:var(--g);color:#fff;border-color:transparent}
.tag{font-size:.8em;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mu);white-space:nowrap}
.ir{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;margin-bottom:8px}.ir select{grid-column:1/-1}.ir button{min-height:var(--tap);border:1px solid var(--rd);border-radius:10px;color:var(--rd);font-weight:700}
#mo{position:fixed;inset:0;background:rgba(10,8,24,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
#md{background:var(--w);border-radius:20px;padding:18px;width:100%;max-width:460px;max-height:92dvh;overflow:auto}#md h3{margin-bottom:10px}
.pvb{max-height:60dvh;overflow:auto;text-align:center;background:var(--bg);border-radius:10px;padding:8px}.pvb img{width:100%;max-width:420px;display:block;margin:0 auto 10px;box-shadow:var(--sh);background:#fff}
#snk{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;width:min(520px,calc(100% - 24px));background:#1a1630;color:#fff;border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:8;box-shadow:var(--sh);animation:up .3s}#snk span{margin-right:auto;font-weight:600;overflow-wrap:anywhere}#snk button{color:color-mix(in srgb,var(--c) 35%,#fff);font-weight:700;padding:10px 6px;min-height:var(--tap)}@keyframes up{from{opacity:0;transform:translate(-50%,20px)}}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);background:#1a1630;color:#fff;padding:9px 16px;border-radius:99px;z-index:10;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translateX(-50%)}
#bd{display:none}#rc{display:none}
u.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .5s ease-out forwards;pointer-events:none;text-decoration:none}@keyframes rp{to{transform:scale(2.6);opacity:0}}
@media print{@page{margin:12mm}html,body{height:auto}body>*:not(#rc){display:none!important}body{display:block;overflow:visible;background:#fff;color:#000}#rc{display:block;font-size:13px}#rc .card{box-shadow:none;break-inside:avoid;border:1px solid #bbb}#rc h2{margin-bottom:10px}}
@media(min-width:1200px){#v-tg.on{grid-template-columns:1fr 420px}#grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) + 20px),1fr))}.v{padding:24px 32px}#v-tg.on{padding:0}}
@media(max-width:1000px){#v-sg.on,#v-cd.on{display:block}}
@media(max-width:820px){
body{grid-template:"h" auto "m" minmax(0,1fr) "n" auto/1fr}
nav{flex-direction:row;border:0;border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.tab{flex:1;padding:8px 2px}.tab b{font-size:1.35em}
header{padding:8px 14px}#v-tg.on{grid-template-columns:1fr}#grid{padding-bottom:24px;grid-template-columns:repeat(auto-fill,minmax(calc(var(--gw) - 20px),1fr))}
.cartp{position:fixed;left:0;right:0;bottom:0;max-height:86dvh;border:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);z-index:7;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}.cartp.open{transform:none}
.grab{display:block;width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 8px;flex:none}.back{display:block;width:100%;margin-bottom:8px;flex:none}
body.co #bd{display:block;position:fixed;inset:0;background:rgba(10,8,24,.4);z-index:6}
#snk{bottom:calc(var(--nh,72px) + 14px)}}
@media(max-width:480px){#gox span,#gox2 span{display:none}#gox,#gox2{padding:6px 10px}}
@media(prefers-reduced-motion:reduce){*,::after{animation:none!important;transition:none!important}}
</style>

<body>
<header><span class="logo">🧮</span><span id="brand">Tên cửa hàng</span><a id="gox" href="https://congcubanhang.vercel.app/" aria-label="Bán hàng">🧾<span> Bán hàng</span></a><a id="gox2" href="https://congcudathang.vercel.app/" aria-label="Đặt hàng">📋<span> Đặt hàng</span></a><span id="off" hidden>Offline</span><button id="inst" hidden>⤓ Cài app</button></header>
<nav><button class="tab on" data-v="tg"><b>🧮</b>Tính giá</button><button class="tab" data-v="hh"><b>📦</b>Hàng hoá</button><button class="tab" data-v="sg"><b>📒</b>Sổ giá<span class="bdg" id="bsg" hidden></span></button><button class="tab" data-v="cd"><b>⚙️</b>Cài đặt</button></nav>
<main>
<section class="v on" id="v-tg">
 <div class="pane"><div class="row" style="margin:0"><input id="q" type="search" placeholder="Tìm hàng…"><button class="ghost" id="quick" style="flex:none">＋ Tính nhanh</button></div><div id="sumr" class="mu" style="margin-top:8px;font-size:.87em"></div><div class="chips" id="chips"></div><div id="grid"></div></div>
 <div class="pane cartp" id="cartp"><div class="grab" id="grab"></div><button class="ghost back" id="back">← Chọn tiếp</button><div id="calc"></div></div>
</section>
<section class="v" id="v-hh"><div class="row" style="margin:0 0 10px"><input id="pq" type="search" placeholder="Tìm hàng hoá…"><button class="pri" style="flex:none" id="padd">+ Thêm</button></div><div class="card" id="plist"></div><div class="card" id="linkc"></div></section>
<section class="v" id="v-sg"><div class="card full" id="rvc" hidden></div><div class="card" id="upc" hidden></div><div class="card" id="rpt"></div><div class="card full" id="soldc" hidden></div><div class="card full" id="hist"></div><div class="card full np" id="actc"></div></section>
<section class="v" id="v-cd"><div class="card" id="cfgc"></div><div class="card" id="uic"></div><div class="card full" id="datac"></div></section>
</main>
<div id="bd"></div><div id="mo" hidden><div id="md" role="dialog" aria-modal="true"></div></div><div id="snk" hidden></div><div id="toast"></div><div id="rc"></div>
<script>
const K='tg1';
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n||0).toLocaleString('vi-VN');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').trim();
/* đọc số: giống hệt Bán hàng và Đặt hàng (25k, 1.000, 1,000, 12,5) */
const num=v=>{const raw=String(v??''),kk=/^\s*[\d.,]+\s*k\s*$/i.test(raw);let s=raw.replace(/[^\d.,-]/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return parseFloat(s)*(kk?1000:1)};
const n0=v=>{const x=num(v);return isFinite(x)?x:0};
const p2=n=>String(n).padStart(2,'0'),dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},dm=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()};
const DEF=()=>({cfg:{name:'',color:'#7048e8',mode:'markup',pct:20,fc:35,step:500,rnd:'near',min:10,waste:0,extra:0,urlBan:'https://congcubanhang.vercel.app/',urlDat:'https://congcudathang.vercel.app/',gp:{},bkd:7,big:0,vib:1},items:[],log:[],lb:0,mig:2});
let S=DEF(),TG={id:'',cost:'',q:'1',p:null,mp:'',quick:0},Q='',G='',ED=null,SM=5,OT=[],T='tg',PG=[],hs,PV=null,MS=false;
/* ---- lưu trữ: IndexedDB trên máy này; bản localStorage cũ (khoá tg1) chỉ đọc một lần để chuyển sang ---- */
let DBH=null;
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('tinh-gia-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function apply(v){S=Object.assign(DEF(),v,{cfg:Object.assign(DEF().cfg,v.cfg)});if(!S.cfg.gp||typeof S.cfg.gp!=='object')S.cfg.gp={};if(!Array.isArray(S.log))S.log=[];S.items.forEach(i=>{if(!Array.isArray(i.ing))i.ing=[]});if((v.mig||0)<2){if(S.cfg.color==='#2f5233')S.cfg.color='#7048e8';S.mig=2;save()}}
async function load(){let v=null;try{DBH=await idb();v=await new Promise(r=>{const q=DBH.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){DBH=null}
 if(!(v&&Array.isArray(v.items))){v=null;try{v=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(v&&Array.isArray(v.items)){apply(v);save();return}v=null}
 if(v)apply(v)}
function save(){if(DBH){try{const t=DBH.transaction('kv','readwrite');t.objectStore('kv').put(S,'s');t.onerror=()=>toast('Không lưu được dữ liệu — máy có thể hết dung lượng',1);return}catch(e){}}
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Không lưu được dữ liệu trên máy này — hãy sao lưu thường xuyên',1)}}
const hap=k=>{if(S.cfg.vib&&navigator.vibrate)try{navigator.vibrate(k==='tap'?18:k==='ok'?[30,40,30]:[25,60,25])}catch(e){}};

function choose(msg,onMerge,onReplace){modal(`<h3>Nhập dữ liệu</h3><p style="margin-bottom:10px">${msg}</p><div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="ghost" id="c_m">Gộp</button><button class="dng" id="c_r">Thay thế</button></div><p class="mu" style="font-size:12px;margin-top:8px">Gộp: giữ dữ liệu hiện có, cập nhật hàng trùng nhóm + tên. Thay thế: xoá phần hiện có.</p>`);$('#c_m').onclick=()=>{closeM();onMerge();hvAll();save();applyCfg();go('cd');toast('Đã gộp')};$('#c_r').onclick=()=>{if(confirm('Thay thế dữ liệu hiện có?')){closeM();onReplace();save();applyCfg();go('cd');toast('Đã thay thế')}}}
function impJSON(t){let d;try{d=JSON.parse(t)}catch(e){toast('File JSON không đọc được',1);return}
 let X0=null;if(d&&d.app==='tinh-gia-local'&&d.S&&Array.isArray(d.S.items))X0=d.S;else if(d&&!d.app&&Array.isArray(d.items))X0=d;
 if(!X0){toast('Không phải file sao lưu của Công cụ tính giá',1);return}
 const X=cleanX(X0);choose(`File có ${X.items.length} hàng hoá, ${X.log.length} lần đổi giá.`,
  ()=>{const mt={},map={};X.items.forEach(o=>{const e=findItem(o.g,o.n);if(e){mt[o.id]=e;map[o.id]=e.id}else map[o.id]=S.items.some(i=>i.id===o.id)?uid():o.id});
   X.items.forEach(o=>{const ing=o.ing.map(l=>({...l,id:map[l.id]||l.id})),e=mt[o.id];if(e)Object.assign(e,o,{id:e.id,ing});else S.items.push({...o,id:map[o.id],ing})});
   const seen=new Set(S.log.map(l=>l.d+'|'+l.id+'|'+l.p));X.log.forEach(l=>{const n={...l,id:map[l.id]||l.id},k=n.d+'|'+n.id+'|'+n.p;if(!seen.has(k)){seen.add(k);S.log.push(n)}});S.log.sort((a,b)=>b.d-a.d);S.log.length=Math.min(S.log.length,500);if(!S.cfg.name)S.cfg=Object.assign(DEF().cfg,X.cfg)},
  ()=>{S=Object.assign(DEF(),X,{mig:2,cfg:Object.assign(DEF().cfg,X.cfg)});TG={id:'',cost:'',q:'1',p:null,mp:'',quick:0}})}
/* ---- cài app, trạng thái mạng, service worker ---- */
let IP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!IP)return;IP.prompt();await IP.userChoice;IP=null;$('#inst').hidden=true};
const net=()=>$('#off').hidden=navigator.onLine;addEventListener('online',net);addEventListener('offline',net);net();
/* nhận gói được chia sẻ vào app (Android: Chia sẻ → chọn app) */
function SHR(){if(!/[?&]shared=1/.test(location.search))return;history.replaceState(null,'',location.pathname);try{caches.open('share').then(c=>c.match('share-pkg').then(async r=>{if(!r)return;const t=await r.text();await c.delete('share-pkg');xOpen(t)}))}catch(e){}}
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had||$('#upd'))return;const b=document.createElement('div');b.id='upd';b.innerHTML='<span>Đã có bản mới</span><button>Cập nhật ngay</button>';b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
/* ---- Tính giá: phần riêng của gói trao đổi (chủ: giá bán, giá KM, công thức; nhận giá nhập từ Đặt hàng, hết hàng và báo cáo từ Bán hàng) ---- */
const XME='gia';
const XQ=qc=>{const m=String(qc||'').match(/([\d.,]+)\s*([^\/\d]*?)\s*\//),q=m?num(m[1]):0;return q>0?{q,u:(m[2].trim()||'cái').slice(0,20)}:null};
const XG={to:[['ban','Gửi cho Bán hàng (giá bán, giá KM, giá vốn)'],['dat','Gửi cho Đặt hàng (danh mục hàng mua)']],
 hint:'Nhập gói từ Đặt hàng để cập nhật giá nhập, từ Bán hàng để nhận hết hàng và báo cáo bán. Gửi gói giá bán cho Bán hàng, danh mục hàng mua cho Đặt hàng.',
 out(to){if(to==='ban')return{items:S.items.filter(i=>i.price>0).map(i=>({gid:ensureGid(i),name:i.n,group:i.g||'',unit:i.u||'',fav:i.f?1:0,upd:i.upd||0,price:i.price,sp:i.sp>0&&i.sp<i.price?i.sp:0,uc:Math.round(von(i)*100)/100}))};
  return{items:S.items.filter(i=>i.t==='b').map(i=>({gid:ensureGid(i),name:i.n,group:i.g||'',fav:i.f?1:0,upd:i.upd||0,buy:{lu:i.lu||'lố',qc:i.q+' '+i.u+'/'+(i.lu||'lố'),cost:i.cost}}))}},
 plan(P){const ops=[],cl=[],noqc=[],L=[],W=[];let nw=0,nv=0,nr=0,nl=0,sk=0,ns=0,np=0;
  if(P.from==='dat'){
   P.items.forEach(i=>{if(!i.buy)return;const e=xFind(S.items,i),c=i.buy.cost,q=XQ(i.buy.qc);
    if(!e){if(!(c>0)){sk++;return}nw++;if(!q)noqc.push(i.name);ops.push(()=>S.items.push({id:uid(),gid:i.gid,t:'b',g:i.group,n:i.name,u:q?q.u:(i.buy.lu||'cái'),lu:i.buy.lu||'lố',q:q?q.q:1,cost:c,ing:[],waste:0,extra:0,price:0,sp:0,so:0,f:i.fav,upd:i.upd}));return}
    if(e.t==='c'){sk++;return}
    const chg=c>0&&(e.cost!==c||(q&&(e.q!==q.q||e.u!==q.u))),rn=i.upd>(e.upd||0)&&(e.n!==i.name||e.g!==i.group);
    if(chg){nv++;if(cl.length<8)cl.push(esc(e.n)+': vốn nhập '+fmt(e.cost)+' → '+fmt(c))}if(rn)nr++;if(!hasGid(e,i.gid))nl++;
    ops.push(()=>{xAdopt(e,i);if(chg){if(e.price&&!e.vs)e.vs=von(e);e.cost=c;if(q){e.q=q.q;e.u=q.u}if(i.buy.lu)e.lu=i.buy.lu}xShared(e,i)})});
   if(nw)L.push(`<b>${nw}</b> hàng mới`);if(nv)L.push(`<b>${nv}</b> giá nhập đổi (các món đổi giá vốn sẽ hiện ở Sổ giá để xem lại)`);cl.forEach(t=>L.push(`<span class="mu">${t}</span>`));if(nv>cl.length)L.push(`<span class="mu">… và ${nv-cl.length} hàng khác</span>`);
   if(nr)L.push(`<b>${nr}</b> hàng đổi tên/nhóm`);if(nl)L.push(`<b>${nl}</b> hàng được liên kết với Đặt hàng (khớp theo tên)`);
   if(noqc.length)W.push(`${noqc.length} hàng mới chưa đọc được quy cách (cần dạng “24 lon/thùng”), tạm tính 1 đơn vị mỗi lố: ${noqc.slice(0,5).map(esc).join(', ')}${noqc.length>5?'…':''}`);
   if(sk)W.push(`${sk} hàng bị bỏ qua (món chế biến, hoặc hàng mới chưa có giá nhập)`)}
  else{
   P.items.forEach(i=>{const e=xFind(S.items,i),sp=i.sp>0&&i.sp<i.price?i.sp:0;
    if(!e){if(!(i.uc>0)||!(i.price>0)){sk++;return}nw++;ops.push(()=>S.items.push({id:uid(),gid:i.gid,t:'b',g:i.group,n:i.name,u:i.unit||'cái',lu:i.unit||'cái',q:1,cost:i.uc,ing:[],waste:0,extra:0,price:i.price,sp,so:i.so,f:i.fav,vs:i.uc,upd:i.upd}));return}
    const so=i.so?1:0,cs=so!==(e.so?1:0),cp=!e.price&&i.price>0,rn=i.upd>(e.upd||0)&&(e.n!==i.name||e.g!==i.group);
    if(cs)ns++;if(cp)np++;if(rn)nr++;if(!hasGid(e,i.gid))nl++;
    ops.push(()=>{xAdopt(e,i);e.so=so;if(cp){e.price=i.price;e.vs=von(e)}if(!(e.sp>0)&&sp>0&&sp<(e.price||0))e.sp=sp;xShared(e,i)})});
   if(nw)L.push(`<b>${nw}</b> hàng mới`);if(ns)L.push(`<b>${ns}</b> hàng đổi trạng thái hết hàng`);if(np)L.push(`<b>${np}</b> hàng chưa có giá được điền giá bán`);if(nr)L.push(`<b>${nr}</b> hàng đổi tên/nhóm`);if(nl)L.push(`<b>${nl}</b> hàng được liên kết với Bán hàng (khớp theo tên)`);
   if(P.report)L.push(`Báo cáo bán ${xd(P.report.from)} – ${xd(P.report.to)}: <b>${P.report.rows.length}</b> mặt hàng (xem ở Sổ giá)`);
   if(sk)W.push(`${sk} hàng chỉ có ở Bán hàng bị bỏ qua vì chưa có giá vốn`)}
  return{lines:L,warn:W,n:nw+nv+nr+nl+ns+np,apply(){ops.forEach(f=>f());if(P.report)S.rep=P.report;hvAll();badge();return P.from==='dat'?`${nw} hàng mới, ${nv} giá nhập đổi.`:`${nw} hàng mới, ${ns} đổi trạng thái hết hàng${P.report?', đã nhận báo cáo bán':''}.`}}},
 refresh(){go(T)}};

/* ===== GÓI TRAO ĐỔI giữa Bán hàng, Đặt hàng, Tính giá =====
   Khối này giống hệt ở cả ba công cụ. Phần riêng từng app là XME và XG ngay phía trên.
   Quy tắc: mỗi trường có một chủ. Gói chỉ ghi đè trường mà bên gửi làm chủ; tên, nhóm theo bản sửa mới hơn (upd); Yêu thích giữ riêng từng app;
   trường còn lại chỉ điền vào chỗ trống. Hàng khớp theo mã chung (gid); lần đầu mới khớp theo nhóm + tên rồi gán mã. */
const XN={ban:'Bán hàng',dat:'Đặt hàng',gia:'Tính giá'};
function xn(v){v=+v;return isFinite(v)&&v>0?Math.round(v*100)/100:0}
function xc(s,n){return String(s??'').slice(0,n)}
function xd(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}
function gsid(v){return String(v??'').replace(/[^\w-]/g,'').slice(0,64)}
function hasGid(o,g){return o.gid===g||(Array.isArray(o.ga)&&o.ga.includes(g))}
function ensureGid(o){if(!o.gid)o.gid=uid();return o.gid}
function xk(g,n){g=norm(g);return(g==='khac'?'':g)+'|'+norm(n)}
function xFind(list,i){let e=list.find(x=>hasGid(x,i.gid));if(e)return e;e=list.find(x=>xk(x.g,x.n)===xk(i.group,i.name));if(e)return e;
 const m=list.filter(x=>norm(x.n)===norm(i.name));return m.length===1&&(!norm(i.group)||!norm(m[0].g))?m[0]:null}
function xAdopt(e,i){if(!e.gid)e.gid=i.gid;else if(!hasGid(e,i.gid)){(e.ga=e.ga||[]).push(i.gid);if(e.ga.length>10)e.ga.shift()}}
function xShared(e,i){if(i.upd>(e.upd||0)){e.n=i.name;e.g=i.group;if(i.unit&&XME!=='dat')e.u=i.unit;e.upd=i.upd}}
function xClean(i){if(!i||typeof i!=='object')return null;const g=gsid(i.gid),n=xc(i.name,120).trim();if(!g||!n)return null;const b=i.buy&&typeof i.buy==='object'?i.buy:null;
 return{gid:g,name:n,group:xc(i.group,60),unit:xc(i.unit,20),fav:i.fav?1:0,so:i.so?1:0,upd:xn(i.upd),price:xn(i.price),sp:xn(i.sp),uc:xn(i.uc),buy:b?{lu:xc(b.lu,20),qc:xc(b.qc,60),cost:xn(b.cost)}:null}}
function xRep(r){if(!r||!Array.isArray(r.rows))return null;return{from:xn(r.from),to:xn(r.to),at:Date.now(),rows:r.rows.slice(0,1000).map(x=>({gid:gsid(x.gid),name:xc(x.name,120),q:xn(x.q),rev:xn(x.rev),cr:xn(x.cr),cc:xn(x.cc)})).filter(x=>x.name)}}
function xText(items,extra){const c=S.cfg;if(!c.shopId)c.shopId=uid();
 return JSON.stringify(Object.assign({format:'tiem',v:1,from:XME,exportedAt:Date.now(),shop:{shopId:c.shopId,name:c.name||'',phone:c.phone||'',addr:c.addr||'',foot:c.foot||c.footer||''},items},extra||{}),null,1)}
async function xExport(to){const o=XG.out(to);if(!o.items.length)return toast('Chưa có hàng nào để gửi',1);save();
 const name='tiem-'+XME+'-cho-'+to+'-'+dk(Date.now())+'.json',ok=await backupFile(name,xText(o.items,o.extra));if(ok){save();toast('Đã tạo gói gửi cho '+XN[to])}}
function xOpen(text){let d;try{d=JSON.parse(text)}catch(e){return toast('File không đọc được',1)}
 if(!d||d.format!=='tiem'||d.v!==1||!Array.isArray(d.items)||!XN[d.from])return toast('Không phải gói trao đổi của bộ công cụ (hãy xuất bằng nút “Gửi cho …”)',1);
 if(d.from===XME)return toast('Đây là gói do chính app này xuất ra',1);
 const sh=d.shop&&typeof d.shop==='object'?d.shop:{},P={from:d.from,at:xn(d.exportedAt),items:d.items.slice(0,5000).map(xClean).filter(Boolean),report:xRep(d.report),shop:{}};
 ['shopId','name','phone','addr','foot'].forEach(k=>P.shop[k]=k==='shopId'?gsid(sh[k]):xc(sh[k],120));
 const pl=XG.plan(P),other=!!(P.shop.shopId&&S.cfg.shopId&&P.shop.shopId!==S.cfg.shopId);
 modal(`<h3>Nhập gói từ ${XN[P.from]}</h3><p class="mu" style="margin-bottom:8px">Xuất lúc ${P.at?xd(P.at)+' '+new Date(P.at).toTimeString().slice(0,5):'không rõ'} · ${P.items.length} hàng${P.report?' · có báo cáo bán':''}</p>`
 +(other?'<p class="er" style="margin-bottom:8px">Gói này mang mã tiệm khác với tiệm trong app. Chỉ nhập nếu đây vẫn là cùng một tiệm.</p>':'')
 +pl.warn.map(w=>`<p class="er" style="margin-bottom:6px">${w}</p>`).join('')
 +(pl.lines.length?pl.lines.map(l=>`<div class="li"><span>${l}</span></div>`).join(''):'<p class="mu">Không có gì thay đổi.</p>')
 +`<div class="row"><button class="ghost" onclick="closeM()">Hủy</button><button class="pri" id="xg_ok"${pl.n||P.report?'':' disabled'}>${other?'Vẫn nhập':'Nhập'}</button></div>`,1);
 $('#xg_ok').onclick=()=>{const snap=JSON.stringify(S);let msg;
  try{msg=pl.apply()}catch(e){S=JSON.parse(snap);toast('Nhập gói không thành công, dữ liệu giữ nguyên',1);closeM();return}
  const c=S.cfg;if(P.shop.shopId&&(other||!c.shopId))c.shopId=P.shop.shopId;if(!c.shopId)c.shopId=uid();
  const fk=c.footer!==undefined?'footer':'foot';['name','phone','addr'].forEach(k=>{if(!c[k]&&P.shop[k])c[k]=P.shop[k]});if(!c[fk]&&P.shop.foot)c[fk]=P.shop.foot;
  save();applyCfg();XG.refresh();
  modal(`<h3>Đã nhập gói</h3><p style="margin-bottom:10px">${msg}</p><div class="row"><button class="ghost" id="xg_un">↶ Hoàn tác</button><button class="pri" onclick="closeM()">Xong</button></div>`);
  $('#xg_un').onclick=()=>{S=JSON.parse(snap);save();applyCfg();XG.refresh();closeM();toast('Đã hoàn tác nhập gói')}}}
function xBtns(){return `<p class="hint" style="margin:0 0 8px">${XG.hint}</p><div class="g2">${XG.to.map(([t,l])=>`<button class="ghost" data-xg="out:${t}">⬇ ${l}</button>`).join('')}<button class="ghost" data-xg="in">⬆ Nhập gói từ app khác</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-xg]');if(!b)return;const k=b.dataset.xg;if(k==='in')pick('.json,.txt,text/plain,application/json',xOpen);else xExport(k.slice(4))});
(async function(){if(history.state&&history.state.ov)history.replaceState(null,'');await load();S.items.forEach(i=>{if(i.price&&!i.vs)i.vs=von(i)});hvAll();applyCfg();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(bkDue())toast('Đã lâu chưa sao lưu — vào Cài đặt để sao lưu');
 go('tg');SHR()})();
</script>
